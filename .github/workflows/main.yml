---
name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '**.md'

jobs:
  build:
    name: Test Runner
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4c0219f9ac95b02789c1075625400b2acbff50b1
        with:
          install: true

      - name: Build Docker image and store in cache
        uses: docker/build-push-action@2eb1c1961a95fc15694676618e422e8ba1d63825
        with:
          context: .
          push: false
          load: true
          tags: exercism/python-test-runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Tests in Docker
        run: bin/run-tests-in-docker.sh

#      - name: Install Git
#        run: apk update && apk add git --no-cache

      - name: Checkout Python Repo
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
        with:
          repository: exercism/python
          path: main

      - name: Checkout Python Repo
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
        with:
          repository: exercism/problem-specifications
          path: main


#      - name: Install Dependencies
#        run: |
#          pip install -r requirements-generator.txt
#
#      - name: Generate tests
#        run: |
#          bin/generate_tests.py --verbose -p .problem-specifications --check
#
#      - name: Test template status
#        continue-on-error: true
#        run: |
#          bin/template_status.py -v -p .problem-specifications
#
#      - name: Check exercises
#        run: |
#          bin/test_exercises.py

      - name: Run Exercise Tests
        run: |
          bin/test_exercises.py --runner test-runner
